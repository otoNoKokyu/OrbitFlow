<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            margin: auto;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .otp-code {
            font-size: 24px;
            color: #007BFF;
            font-weight: bold;
            letter-spacing: 3px;
            background: #f0f8ff;
            border: 1px solid #cce7ff;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .resend {
            color: #007BFF;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .resend:hover {
            color: #0056b3;
        }

        .footer {
            font-size: 12px;
            color: #888;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verify Your OTP</h1>
        <p>To proceed, please enter the following OTP sent to your registered email address or phone number.</p>
        <div class="otp-code"><placeholder></div>
        <div class="footer">
            © 2024 OrbitFlow. All rights reserved.
        </div>
    </div>
</body>
</html>
